<script>
ZOHO.embeddedApp.on("PageLoad", function(data){
  console.log("PAGE LOAD DATA:", JSON.stringify(data));
  
  ZOHO.CRM.INTERACTION.getPageInfo()
  .then(function(info){
    console.log("PAGE INFO:", JSON.stringify(info));
    
    try{
      const record = info.EntityData || {};
      console.log("RECORD:", JSON.stringify(record));
      
      const phone = record.Mobile || record.Phone || null;
      console.log("PHONE:", phone);
      
      if(!phone){
        document.getElementById("phoneDisplay").innerHTML = "No phone found";
        return;
      }
      
      document.getElementById("phoneDisplay").innerHTML = phone;
      document.getElementById("btn").disabled=false;
      
      const cleaned = phone.replace(/\D/g,'');
      const final = cleaned.length==10 ? "+1"+cleaned : "+"+cleaned;
      const gvUrl = "https://voice.google.com/u/0/calls?a=nc,"+encodeURIComponent(final);
      
      document.getElementById("btn").onclick=function(){
        window.parent.postMessage({type:"GV_OPEN", url:gvUrl},"*");
      };
    }
    catch(e){
      document.getElementById("phoneDisplay").innerHTML = "error";
      console.log("ERROR:", e);
    }
  })
  .catch(function(err){
    console.log("PROMISE ERROR:", err);
    document.getElementById("phoneDisplay").innerHTML = "Failed to get info";
  });
});

ZOHO.embeddedApp.init();
</script>
