<!DOCTYPE html>
<html>
<head>
  <script src="https://live.zwidgets.com/js-sdk/1.0/ZohoEmbededAppSDK.min.js"></script>
</head>
<body>

<script>
ZOHO.embeddedApp.on("PageLoad", async function(data) {

  const record = await ZOHO.CRM.API.getRecord({
    Entity: data.Entity,
    RecordID: data.EntityId
  });

  const phone = record.data[0].Phone;

  if (phone) {
    chrome.runtime.sendMessage(
      "imgmleiaadajaiclmfdeaonenphmlmkb",
      { action: "call", phone: phone }
    );
  }

  // 🔥 No espera nada, solo continúa
  setTimeout(() => {
    ZOHO.CRM.BLUEPRINT.proceed();
  }, 400);

});

ZOHO.embeddedApp.init();
</script>

</body>
</html>
